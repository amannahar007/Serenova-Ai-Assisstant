services:
  # ============================================================================
  # 1. Serenova Python AI Engine (FastAPI + ChromaDB / LangChain)
  # ============================================================================
  - type: web
    name: serenova-python-api
    runtime: python
    rootDir: backend
    buildCommand: "chmod +x build.sh && ./build.sh"
    startCommand: "uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: ALLOW_INSECURE_DEV_AUTH
        value: "true"

  # ============================================================================
  # 2. Serenova Node.js API (Express + MongoDB)
  # ============================================================================
  - type: web
    name: serenova-node-api
    runtime: node
    rootDir: backend-node
    buildCommand: "npm install"
    startCommand: "node server.js"
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
